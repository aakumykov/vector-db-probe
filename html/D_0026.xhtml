  <p class="para2"><span class="termin" id="toc_32">Древесно-уксусный порошок</span> — продукт, получаемый обработкой известью подсмольной воды, образующейся в результате сухой перегонки древесины. Он состоит главным образом из кальциевой соли уксусной кислоты (ацетата кальция) Ca(CH<sub>3</sub>COQ)<sub>2</sub>. Перерабатывается на уксусную кислоту.</p>
