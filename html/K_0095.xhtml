  <p class="para2"><span class="termin" id="toc_119">Кратная связь</span> — химическая связь, образованная более чем одной связывающей электронной парой: двойная — за счет двух электронных пар, тройная — за счет трех электронных пар и четверная за счет четырех электронных пар.</p>
