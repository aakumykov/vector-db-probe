  <p class="para2"><span class="termin" id="toc_8">Ил активный</span> — масса бактериального вещества, которая образуется при очистке сточных вод путем аэрации. Продувание воздуха (аэрация) через сточные воды приводит к быстрому росту и размножению аэробных бактерий, которые питаются органическими примесями в воде.</p>
