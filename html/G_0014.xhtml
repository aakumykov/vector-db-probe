  <p class="para2"><span class="termin" id="toc_17">Галалит (искусственный рог)</span> — роговидная пластмасса на основе технического казеина с добавками мочевины, пластификатора и красителя. Смесь пластифицируют, формуют, а затем отверждают в 3 — 5%-ном водном растворе формальдегида (формалине). Используют для изготовления пуговиц, гребней и т. п.</p>
