  <p class="para2"><span class="termin" id="toc_15">Газолин</span> (газ + лат. oleum — масло) — жидкий продукт, получаемый при перегонке нефти или при разделении промышленных нефтяных газов. Применяют как топливо для карбюраторных двигателей внутреннего сгорания, а также как растворитель при экстракции масличных и смолистых веществ.</p>
