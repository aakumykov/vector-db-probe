  <p class="para2"><span class="termin" id="toc_35">Тигель (от нем. Tiegel)</span> — сосуд горшкообразной формы, изготавливаемый из тугоплавких или огнеупорных металлов или неметаллических материалов — фарфор, корунд и т. п. Используют для проведения химических и металлургических процессов в расплавах и при высоких температурах.</p>
