  <p class="para2"><span class="termin" id="toc_28">Флюорит</span> — см. <a href="../../#Plavikovyjshpat" class="termin_link" id="toc_29">Плавиковый шпат</a>.</p>

  <p class="para2"><span class="termin" name="Fljuoroz" id="toc_30">Флюороз</span> (лат. fluorum — фтор) — хроническое костное заболевание, развивающееся при длительном избыточном поступлении в организм соединений фтора. Одной из наиболее распространенных причин является повышенное содержание фторидов в питьевой воде.</p>
