  <p class="para2"><span class="termin" id="toc_29">Перламутр</span> — вещество, образуемое предохранительной тканью жемчугоносных моллюсков. Состоит из тонкой решетки тёмно-коричневого органического вещества, пустоты которого заполнены мелкими кристаллами арагонита — ромбической модификации CaCO<sub>3</sub>.</p>
