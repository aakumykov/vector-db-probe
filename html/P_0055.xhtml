  <p class="para2"><span class="termin" id="toc_71">Поталь</span> — сплав на основе меди и цинка, внешне похожий на золото. Он способен раскатываться в тонкие листочки, напоминающие сусальное золото. В отличие от последнего листок поталя растворяется в азотной кислоте, а капля раствора нитрата серебра оставляет на нем темное пятно.</p>
