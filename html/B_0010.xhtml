  <p class="para2"><span class="termin" id="toc_10">Баррель</span> (англ. barrel — бочка) — единица вместимости и объема сыпучих веществ и жидкостей в Великобритании, США и некоторых других странах. Английский баррель сыпучих веществ равен 163,65 л, в США — 115,6 л, нефтяной баррель в США — 159 л.</p>
