  <p class="para2"><span class="termin" id="toc_29">Ронгалит</span> — техническое название вещества, применяемого при крашении тканей в качестве сильного восстановителя. В его состав входят два активных компонента — натриевая соль сульфоксиловой кислоты NaHSO<sub>2</sub> и формальдегид HCHO, образующие кристаллы, с двумя молекулами воды NaHSO<sub>2</sub> • HCHO • 2Н<sub>2</sub>О.</p>
