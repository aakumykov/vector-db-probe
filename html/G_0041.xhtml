  <p class="para2"><span class="termin" id="toc_47">Геохронология</span> (от греч. ge — Земля, chronos — время и logos — учение) — раздел геохимии, относящийся к определению возраста горных пород и хронологической последовательности формирования земной коры. Возраст Земли специалисты оценивают 4,6 млрд. лет.</p>
