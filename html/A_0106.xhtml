  <p class="para2"><span class="termin" id="toc_129">Аэросил</span> — высокодисперсный аморфный диоксид кремния SiO<sub>2</sub>. Применяют в качестве наполнителя резин и пластмасс, как носитель для гетерогенных катализаторов, а также в качестве загустителя различных жидких составов, например смазочных масел.</p>
