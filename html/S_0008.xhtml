  <p class="para2"><span class="termin" id="toc_9">Сапонины</span> (от лат. sapo (saponis) — мыло) — органические соединения из группы гликозидов. C водой способствуют образованию пены. Применяют как компоненты шампуней и лекарственных препаратов. Добавляют в шипучие напитки и пиво.</p>
