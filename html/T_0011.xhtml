  <p class="para2"><span class="termin" id="toc_13">Температура и цвет свечения</span>. О температуре нагретого тела можно судить «на глаз» по цвету его свечения. Начальное свечение (<sup>o</sup>C) красное — 525, темно-красное — 700, светло-красное — 950, оранжевое — 1100, желтое — 1200, белое — 1300, ослепительно белое — 1500.</p>
