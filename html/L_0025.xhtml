  <p class="para2"><span class="termin" id="toc_30">Лигроин</span> — один из продуктов перегонки нефти, который отгоняется в интервале температур 120 — 240°С. Имеет плотность несколько большую, чем бензин. По этой причине его называют также «тяжелым бензином». Применяют как дизельное топливо и как растворитель в лакокрасочной промышленности.</p>
