  <p class="para2"><span class="termin" id="toc_32">Мозаика</span> — вид живописи, техника, украшения, используемая главным образом для стен и полов. Для этого на цементную основу укладывают небольшие цветные кусочки камня, смальты или керамики, образующие рисунок. Высокий уровень это искусство получило в Римской империи.</p>
