  <p class="para2"><span class="termin" id="toc_74">Правило Хунда</span> — фундаментальное правило квантовой механики, сформулированное немецким ученым Ф. Хундом, которое описывает распределение электронов &#160;внутри оболочки атома в основном состоянии: суммарный спин электронов данной оболочки должен быть максимальным.</p>
