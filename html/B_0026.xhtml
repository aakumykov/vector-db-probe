  <p class="para2"><span class="termin" id="toc_29">Биосфера</span> (от био... и греч. sphaira — шар) — оболочка Земли, состав, структура и энергетика которой определяются совокупной деятельностью живых организмов. В состав биосферы входит нижняя часть атмосферы от поверхности земли до озонового слоя (20 — 25 км), гидросфера и верхняя часть литосферы.</p>
