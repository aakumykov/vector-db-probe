  <p class="para2"><span class="termin" id="toc_13">Газойль</span> (газ + англ, oil — масло) — сорт жидкого углеводородного топлива для дизелей. Получается при перегонке нефти в интервале температур 250 — 400°С. Служит также сырьем для каталитического крекинга.</p>
