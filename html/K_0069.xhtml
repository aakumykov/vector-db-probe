  <p class="para2"><span class="termin" id="toc_83">Колошниковые газы</span> — газы, выходящие из домны в процессе выплавки железа. Они содержат до <sup>2</sup>/<sub>3</sub> сожженного углерода в виде СО. После очистки от пыли колошниковые газы сжигают и теплоту используют для подогревания вдуваемого в домну воздуха. Последний нагревают до 800°С.</p>
