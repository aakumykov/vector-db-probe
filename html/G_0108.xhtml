  <p class="para2"><span class="termin" id="toc_126">Гуминовые вещества</span> — сложные полимерные органические соединения, образующиеся в результате разложения остатков растительных или животных организмов в воде, почве или донных отложениях. Они придают природным водам характерную желто-коричневую окраску.</p>
