  <p class="para2"><span class="termin" id="toc_13">Ланолин</span> — смесь диэфиров ɑ, β-алкандиолов и C<sub>18</sub> — C<sub>24 </sub>жирных кислот, а также стеринов. Получают очисткой шерстяного, воска, который экстрагируют органическими растворителями из шерсти овец. Применяется для изготовления косметических кремов и лечебных мазей.</p>
