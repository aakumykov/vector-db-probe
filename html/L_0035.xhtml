  <p class="para2"><span class="termin" id="toc_41">Литопон</span> — белая малярная краска, содержащая пигмент белого цвета, состоит из сульфида цинка ZnS и сульфата бария BaSO<sub>4</sub>. Применяют вместо ядовитых свинцовых белил, которые в настоящее время не выпускаются промышленностью.</p>
