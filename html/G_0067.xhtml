  <p class="para2"><span class="termin" id="toc_79">Гипсовая вода</span> — насыщенный раствор сульфата кальция CaSO<sub>4</sub>. Применяется для обнаружения в растворах солей бария и стронция. При их наличии появляется белый осадок, поскольку растворимость BaSO<sub>4</sub> и SrSO<sub>4</sub> &#160;ниже растворимости CaSO<sub>4</sub>.</p>
