  <p class="para2"><span class="termin" id="toc_14">«Золото в рубашке»</span> — самородное золото, покрытое с поверхности пленкой оксидов железа или марганца. По внешнему виду в нем трудно распознать золото. Указанием на него служит лишь высокая плотность, а значит и большая масса.</p>
