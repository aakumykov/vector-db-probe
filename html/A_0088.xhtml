  <p class="para2"><span class="termin" id="toc_109">Аспирин (ацетилсалициловая кислота)</span> —</p>

  <p class="para0"><img alt="OEBPS/images/image0005.png" class="frame4" src="../images/image0005.png"/>&#160;</p>

  <p class="para2">ненаркотическое средство, устраняющее болевые ощущения. Обладает противовоспалительным, обезболивающим, противоревматическим и жаропонижающим действием. Применяют при невралгиях, мигрени, лихорадочных заболеваниях. Выпускается в виде порошка и таблеток.</p>
