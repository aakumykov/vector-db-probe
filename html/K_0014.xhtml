  <p class="para2"><span class="termin" id="toc_15">Капролит</span> — высохшие или окаменевшие экскременты. В условиях сухого климата (например, в пустынях) они сохраняются длительное время и по ним можно судить о рационе обитавших в тех местах людей и животных.</p>
