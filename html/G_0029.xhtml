  <p class="para2"><span class="termin" id="toc_32">Гальванотропизм</span> (гальвано... + греч. tropos — поворот, направление) — явление реагирования отдельных органов растений на пропускание электрического тока &#160;через окружающую жидкую среду, например искривление корней растений и направлении прохождения тока.</p>
