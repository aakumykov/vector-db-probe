  <p class="para2"><span class="termin" id="toc_53">Пластилин</span> (греч. plastos — лепной) — материал для лепки. Изготавливают из очищенного и измельченного порошка глины с добавлением воска, сала и других веществ, препятствующих высыханию. Окрашивают в различные цвета добавлением красителей.</p>
