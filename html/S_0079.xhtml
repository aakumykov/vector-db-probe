  <p class="para2"><span class="termin" id="toc_105">Спирты</span> — большой класс гидроксилсодержащих углеводородов, в которых гидроксильная группа (спиртовая группа — ОН) присоединена к насыщенному атому углерода. В отличие от спиртов у фенолов гидроксильная группа присоединена к бензольному кольцу.</p>
