  <p class="para2"><span class="termin" id="toc_1">Магнезия</span> — оксид магния MgO, порошок белого цвета. Используется в медицине при повышенной кислотности желудочного сока (0,1 — 1 г), при отравлении кислотами, а также в качестве слабого слабительного средства (3 — 5 г). Применяют в производстве цементов, огнеупорных и строительных материалов.</p>
