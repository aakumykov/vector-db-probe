  <p class="para2"><span class="termin" id="toc_30">Терракота</span> — разновидность керамики (дословный перевод с итал. означает «земля обожженная». Представляет собой неглазурованные керамические изделия с пористым черепком красного, коричневого или кремового цветов. Известна с эпохи неолита (8 — 3 тыс. до н. э.).</p>
