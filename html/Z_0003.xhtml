  <p class="para2"><span class="termin" id="toc_3">Замазка для аквариумов</span> — смесь порошков (по 2 мас. ч.) гипса, мела, свинцовою глета и канифоли (1 мас. ч.), разведенная масляным лаком или натуральной олифой до необходимой консистенции. Используется для герметизации аквариумов.</p>
