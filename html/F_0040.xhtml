  <p class="para2"><span class="termin" id="toc_51">Фотоэффект внутренний</span> — явление, обусловленное переходами электронов из связанного состояния в свободное внутри твердого тела. На нем основаны конструкции селеновых фотоэлементов. Для металлов внутренний фотоэффект не наблюдается из-за высокой электрической проводимости.</p>
