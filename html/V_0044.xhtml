  <p class="para2"><span class="termin" id="toc_54">Вода тяжелая D</span><sub>2</sub>O — вода, в молекуле которой вместо протонов содержится дейтерий. В природной воде она содержится примерно в количестве 0,016%. Тяжелая вода кипит при 101,42°С и замерзает при 3,82°С. Она замедляет некоторые биологические процессы, действует угнетающе на живые организмы.</p>
