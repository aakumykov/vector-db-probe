  <p class="para2"><span class="termin" id="toc_13">Агат моховый</span> — полупрозрачный серый или серо-голубой халцедон с дендритоподобными включениями черных, зеленых или бурых гидроксидов марганца и железа, напоминающих мох. Однако свое название камень получил от местности Moxa в Йемене.</p>
