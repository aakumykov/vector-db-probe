  <p class="para2"><span class="termin" id="toc_8">Раствор</span> — однородная система, состоящая из двух или более независимых компонентов, соотношения между которыми могут изменяться. Растворы бывают жидкими (например, морская вода), твердыми (сплавы металлов), газообразными (воздух).</p>
