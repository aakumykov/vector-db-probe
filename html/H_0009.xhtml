  <p class="para2"><span class="termin" id="toc_9">Химия</span> — наука о веществах, их строении и превращениях. Ученые до сих пор не пришли к согласию во мнении о происхождении этого слова. Однако большинство из них считают, что слово «химия» берет свое начало из Египта, где эта наука достигла в свое время большого расцвета.</p>
