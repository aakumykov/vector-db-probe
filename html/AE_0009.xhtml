  <p class="para2"><span class="termin" id="toc_11">Экстракция жидкостная</span> — способ выделения вещества из раствора, основанный на различной растворимости веществ в разных (как правило, несмешивающихся) растворителях. Часто применяется в цветной металлургии для извлечения цветных и редких металлов из растворов с малым их содержанием.</p>
