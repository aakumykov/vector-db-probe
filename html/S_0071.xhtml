  <p class="para2"><span class="termin" id="toc_95">Сорбит</span> HOCH<sub>2</sub>(CHOH)4CH<sub>2</sub>OH — бесцветное кристаллическое вещество, сладкое на вкус. Благодаря этому свойству используют в качестве заменителя сахара для больных сахарным диабетом. Содержится в морских водорослях, соке рябины. Применяют в производстве аскорбиновой кислоты, в косметике.</p>
