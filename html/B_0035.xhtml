  <p class="para2"><span class="termin" id="toc_39">Болотный газ</span> — метан СН<sub>4</sub>, образующийся в болотах вследствие разложения растительных веществ без доступа воздуха. Был открыт (в болотах) и описан итальянцем А. Вольта в 1776 г.</p>
