  <p class="para2"><span class="termin" id="toc_64">Ползучесть материалов</span> — медленная непрерывная деформация твердого тела под воздействием постоянной нагрузки. Ползучести в той или иной мере подвержены все твердые тела — как кристаллические, так к аморфные.</p>
