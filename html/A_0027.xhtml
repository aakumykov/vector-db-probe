  <p class="para2"><span class="termin" id="toc_32">Актиноиды (актиниды)</span> — семейство из 14 радиоактивных химических элементов седьмого периода периодической системы Д.И. Менделеева, следующих за</p>

  <p class="para2">актинием и имеющих атомные номера от 90 до 103. Название «актинид» происходит от корня слова актиний с окончанием -ид от греч. eidos — вид.</p>
