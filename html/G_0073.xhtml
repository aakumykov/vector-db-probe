  <p class="para2"><span class="termin" id="toc_85">Глет</span> — техническое название PbO. Существует в виде двух модификаций: красно-коричневой и желтой. Основным потребителем глета является аккумуляторная промышленность. Служит сырьем для приготовления сурика, в керамической промышленности — для изготовления глазурей, а также для получения хрусталя.</p>
