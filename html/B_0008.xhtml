  <p class="para2"><span class="termin" id="toc_8">Баритовая вода</span> — насыщенный водный раствор гидроксида бария Ba(OH)<sub>2</sub>. Используется в качестве чувствительного реактива на CO<sub>2</sub>. При пропускании через баритовую воду какого-либо газа, содержащего CO<sub>2</sub>, из него выпадает белый осадок BaCO<sub>3</sub>.</p>
