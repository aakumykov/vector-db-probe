  <p class="para2"><span class="termin" id="toc_17">Шпинели</span> — химические соединения, образующиеся при высокой температуре из оксидов двухвалентных металлов и амфотерных оксидов металлов (III) и (IV). Шпинели часто встречаются в природе. Многие из них имеют яркие и характерные окраски и потому применяют в качестве пигментов при изготовлении красок.</p>
