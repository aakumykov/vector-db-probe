  <p class="para2"><span class="termin" id="toc_33">Петролатум</span> — вязкая, светло-коричневая масса получаемая при сернокислотной очистке нефтяных масел. Состоит из парафина, церезина и нефтяных масел. Применяют в качестве загустителя смазочных составов, для изготовления изоляционных и других материалов.</p>
