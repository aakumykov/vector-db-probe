  <p class="para2"><span class="termin" id="toc_21">Цианамид при гидролизе дает аммиак</span> — важнейшее соединение азота:</p>

  <p class="para0">CaCN<sub>2</sub> + ЗН<sub>2</sub>О → CaCO<sub>3</sub> + 2NH<sub>3</sub></p>

  <p class="para2">В настоящее время ацетилен применяют для производства синтетических каучуков, пластмасс, химических волокон и других веществ.</p>
