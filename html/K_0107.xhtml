  <p class="para2"><span class="termin" id="toc_133">Кристаллиты</span>. При затвердевании расплавов металлов образуется одновременно множество мелких кристалликов, которые называются кристаллитами. В отличие от кристаллов размер кристаллитов настолько мал, что они не видны невооруженным глазом. Поэтому на изломе металл кажется монолитным.</p>
