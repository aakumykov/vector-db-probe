  <p class="para2"><span class="termin" id="toc_26">Гальвано...</span> (от имени итальянского ученого Гальвани) — первая составная часть сложных слов, относящихся к электрохимии — науке, изучающей химические реакции, вызываемые электрическим током (электролиз), или превращение энергии окислительно-восстановительных процессов в электричество.</p>
