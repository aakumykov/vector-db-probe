  <p class="para2"><span class="termin" id="toc_6">Лакмус</span> — природное вещество, получаемое при отваре в воде некоторых видов лишайников. Используется в качестве индикатора для установления характера среды. В кислой среде он окрашен в красный цвет, в щелочной — синий.</p>
