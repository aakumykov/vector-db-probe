  <p class="para2"><span class="termin" id="toc_38">Боксит</span> — осадочная порода, состоящая из ряда минералов с большим содержанием AI<sub>2</sub>O<sub>3</sub>. Служит основным сырьем для производства алюминия. В свое время большие залежи бокситов были открыты вблизи французского города Ле Бо (Les Baux).</p>
