  <p class="para2"><span class="termin" id="toc_18">Рекуперация</span> (от лат. recupcratio — получение обратно, возвращение) — возвращение для повторного использования части материала или энергии, неизрасходованных при проведении процесса. В химической технологии рекуперации подвергают растворители, смазочные масла, воду и другие материалы.</p>
