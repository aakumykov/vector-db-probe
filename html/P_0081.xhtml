  <p class="para2"><span class="termin" id="toc_100">Протрава</span> — вещество, которое закрепляет краситель на волокне, делая его нерастворимым. Обычно протравы содержат ионы Cr<sup>3+</sup>, Al<sup>3+</sup>, Fe<sup>3+</sup>, Sn<sup>2+</sup> Применяют для крашения шерсти, реже хлопка и шелка.</p>
