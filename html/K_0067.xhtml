  <p class="para2"><span class="termin" id="toc_80">Коллодий</span> (греч. kollodes — клейкий) — спиртово-эфирный раствор нитроцеллюлозы, дающий твердую пленку после испарения растворителя. Применяют для склеивания различных предметов, в медицине — для закрепления хирургических повязок, в качестве покровного средства для небольших ран.</p>
