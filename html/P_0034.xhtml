  <p class="para2"><span class="termin" id="toc_46">Пирохлор</span> — ниобиевый минерал, который имеет состав NaCaNb<sub>2</sub>O<sub>6</sub>F. Обычно в нем имеются примеси тантала и других редких элементов, но хлора он не содержит. Свое название минерал получил от того, что зеленеет при прокаливании. Хлор — от греч. chloros — зеленый.</p>
