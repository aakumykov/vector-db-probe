  <p class="para2"><span class="termin" id="toc_16">Оксиликвиты</span> (от лат. Oxygenium — кислород и Iiquidus — жидкий) — взрывчатые смеси мелкодисперсного горючего (сажа, древесные опилки, торф, мох и т. п.), пропитанные жидким кислородом. Взрыв инициируется капсюлем-детонатором.</p>
