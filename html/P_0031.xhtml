  <p class="para2"><span class="termin" id="toc_42">Пиритный фильтр</span>. Для удаления из растворов частиц FeS<sub>2</sub> в гидрометаллургии используют раствор сульфата железа (III) Fe<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>, поскольку легко протекает реакция</p>

  <p class="para0">FeS<sub>2</sub> + Fe<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub> = 3FeSO<sub>4</sub> + 2S</p>

  <p class="para2">Технологический процесс, основанный на этой реакции, получил название пиритного фильтра.</p>
