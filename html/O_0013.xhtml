  <p class="para2"><span class="termin" id="toc_14">Оксалурия</span> — повышенное выделение оксалата кальция CaC<sub>2</sub>O<sub>4</sub> с мочой и отложение его в мочевых путях организма человека. Это вызвано нарушением обмена кальция в организме и может быть причиной почечной колики (почечно-каменной болезни).</p>
