  <p class="para2"><span class="termin" id="toc_13">Венецианский кармин</span> — пигмент коричнево-красного цвета Fe<sub>2</sub>O<sub>3</sub>, получаемый сильным нагреванием гидроксида железа (III) Fe(OH)<sub>3</sub>. Используют в качестве косметического средства и называют также румянами.</p>
