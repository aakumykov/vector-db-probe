  <p class="para2"><span class="termin" id="toc_14">Веркблей</span> (от нем. Werk — изделие и Blei — свинец) — промежуточный продукт (черновой свинец), получаемый при плавке свинцовых руд; состоит в основном из свинца и содержит медь, сурьму, небольшие количества примесей серебра, золота и других металлов.</p>
