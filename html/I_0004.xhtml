  <p class="para2"><span class="termin" id="toc_4">Известь венская</span> — смесь CaO и MgO, получаемая в результате обжига доломита CaCO<sub>3</sub>∙MgCO<sub>3</sub>. Тонкоизмельченную венскую известь в виде кашицы с водой используют для химического обезжиривания поверхности металла перед паянием и для тонкой шлифовки и полировки металлов.</p>
