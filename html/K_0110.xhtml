  <p class="para2"><span class="termin" id="toc_137">Крокус</span> — порошок оксида железа (III) Fe<sub>2</sub>O<sub>3</sub> — один из лучших полирующих материалов. Хрустальные, серебряные и золотые изделия приобретают блеск и «игру» после полировки пастой, содержащей крокус.</p>
