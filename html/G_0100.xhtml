  <p class="para2"><span class="termin" id="toc_117">Графит белый</span> — графитообразная модификация нитрида бора BN, которую получают восстановлением оксида бора углеродом в присутствии азота:</p>

  <p class="para0">B<sub>2</sub>O<sub>3</sub> + ЗС + N<sub>2</sub> = 2BN + ЗСО</p>

  <p class="para2">Белый графит применяют как высокоогнеупорный конструкционный материал, а также в качестве сухой смазки.</p>
