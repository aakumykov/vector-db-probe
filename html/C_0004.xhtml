  <p class="para2"><span class="termin" id="toc_5">Целлулоид</span> (целлюлоза + греч. eidos — вид) — пластическая масса на основе нитроцеллюлозы и пластификатора. Применяют для изготовления канцелярских и галантерейных товаров, а также детских игрушек. Его недостатком является легкая воспламеняемость и горючесть.</p>
