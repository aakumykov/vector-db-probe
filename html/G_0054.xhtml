  <p class="para2"><span class="termin" id="toc_61">Гигроскопичность</span> (греч. hygros — влажный, skopeo — наблюдаю) — свойство веществ и материалов поглощать влагу из воздуха. Причиной гигроскопичности могут быть как химические, так и физические свойства.</p>
