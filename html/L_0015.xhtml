  <p class="para2"><span class="termin" id="toc_16">Латекс</span> (от лат. latex — жидкость) — млечный сок, содержащийся у многих растений-каучуконосов. Представляет собой диспергированные в воде коллоидные частицы. Этот термин применяют и к водным эмульсиям синтетических полимеров, называя их синтетическими латексами.</p>
