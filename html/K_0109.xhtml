  <p class="para2"><span class="termin" id="toc_136">Кричный способ</span> — древнейший и простейший процесс выплавки железа из руд. По этому способу железную руду смешивали с большим избытком древесного угля и закладывали в плоские ямы. Уголь зажигали и раздували огонь мехами. В результате получались более или менее связанные слитки (крицы) ковкого железа.</p>
