  <p class="para2"><span class="termin" id="toc_24">Хромофоры</span> (от греч. chroma — цвет + греч. phoros — несущий) — атомные группировки (например, —N=N—, —NO, =C=O), придающие химическому соединению окраску в результате поглощения света в видимой или ближайшей ультрафиолетовой частях света.</p>
