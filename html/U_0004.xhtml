  <p class="para2"><span class="termin" id="toc_4">Углеообразование</span> — геологический процесс образования веществ с прогрессивно увеличивающимся содержанием углерода (торфы и угли) из органических остатков. Происходит в земной коре путем постепенных химических и физико-химических превращений при умеренной температуре (~200°С) и высоком давлении.</p>
