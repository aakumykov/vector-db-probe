  <p class="para2"><span class="termin" id="toc_5">Чугаль</span> — жаростойкий и коррозионно-устойчивый чугун с высоким содержанием алюминия (20 — 24%). Жароупорность достигает 1000<sup>o</sup>C. Применяют главным образом для изготовления деталей печной арматуры.</p>
