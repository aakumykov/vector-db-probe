  <p class="para2"><span class="termin" id="toc_84">Колчедан</span> — общее собирательное название сульфидов и полисульфидов железа, меди, никеля, кобальта, олова, мышьяка. Термин «колчедан» является составной частью синонимов ряда минералов, например железный колчедан, медный колчедан и др.</p>
