  <p class="para2"><span class="termin" id="toc_30">Свинцовый пластырь простой</span> — мазь, состоящая из равных массовых частей оксида свинца (II), свиного жира и подсолнечного масла с добавлением воды в количестве, необходимом для образования пластичной массы. Применяют при гнойно-воспалительных заболеваниях кожи, фурункулах, карбункулах и др.</p>
