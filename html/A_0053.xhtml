  <p class="para2"><span class="termin" id="toc_65">Ангоб</span> — декоративное покрытие в виде тонкого слоя белой или цветной глины, наносимой на поверхность керамического изделия до его обжига для залицовки неровностей и придания изделию качественного внешнего вида и желаемого цвета.</p>
