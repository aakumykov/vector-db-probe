  <p class="para2"><span class="termin" id="toc_1">Обеспыливание дорог</span>. При строительстве и эксплуатации грунтовых и щебеночных дорог с целью их обеспыливания в некоторых странах используют растворы хлорида кальция CaCl<sub>2</sub>. За летний сезон дорогу поливают 3 — 4 раза 75%-ным раствором этой соли.</p>
