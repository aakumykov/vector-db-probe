  <p class="para2"><span class="termin" id="toc_124">Кремни зажигалок (карманных)</span> — стержни, изготавливаемые из смеси редкоземельных металлов и железа. Их основную массу составляют церий (50%) и лантан (40%). Такая смесь металлов пирофорна. Ее мелкие частички, срезаемые колесиком зажигалки, самовоспламеняются и поджигают пары бензина или горючий газ.</p>
