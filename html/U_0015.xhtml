  <p class="para2"><span class="termin" id="toc_19">Уксусная эссенция</span> — пищевая 70- или 80%-ная уксусная кислота. В ней регламентировано содержание муравьиной кислоты, не допускается содержание серной и соляной кислот, а также солей свинца, меди и соединений мышьяка.</p>
