  <p class="para2"><span class="termin" id="toc_18">Галеновы препараты</span> — лекарственные препараты (настойки, экстракты, сиропы и т. п.), получаемые обработкой растительного и животного лекарственного сырья. Названы по имени древнеримского врача Галена, жившего во II в. н. э.</p>
