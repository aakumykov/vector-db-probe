  <p class="para2"><span class="termin" id="toc_5">Известь гидравлическая</span> — продукт обжига известняка, содержащего 10 — 20% глины. При ее гашении крупные куски рассыпаются в порошок. Это позволяет исключить предварительную стадию размалывания обожженного материала, что делает его относительно дешевым.</p>
