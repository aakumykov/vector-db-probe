  <p class="para2"><span class="termin" id="toc_45">Генетические ряды</span> — совокупности органических соединений, характеризующиеся одинаковым числом атомов углерода в молекуле, но имеющие различные функциональные группировки. Например, генетический ряд образуют этанол CH<sub>3</sub>CH<sub>2</sub>OH, ацетальдегид CH<sub>3</sub>CHO<sub>t </sub>уксусная кислота CH<sub>3</sub>COOH.</p>
