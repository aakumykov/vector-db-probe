  <p class="para2"><span class="termin" id="toc_1">Вазелин</span> — мазеобразная смесь веществ, получаемая загущением нефтяных масел твердыми парафиновыми углеводородами, имеющими только одинарные связи между атомами углерода. Применяется в качестве основы для приготовления большинства мазей.</p>
