  <p class="para2"><span class="termin" id="toc_125">Гудрон</span> — черная, вязкая смолистая масса, остающаяся после отгонки из нефти бензиновых, керосиновых и масляных фракций. Его используют для получения нефтяных битумов, как дорожно-строительный материал и сырье для крекинга.</p>
