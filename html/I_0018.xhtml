  <p class="para2"><span class="termin" id="toc_20">Иод играет важную биологическую роль</span>. Он в виде соединений вырабатывается щитовидной железой и его недостаток приводит к заболеванию этого органа.</p>

  <p class="para2">Свободный иод в больших количествах токсичен. Его пары раздражают слизистые оболочки. Концентрированные растворы иода могут вызвать ожоги кожи.</p>
