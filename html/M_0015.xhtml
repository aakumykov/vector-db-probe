  <p class="para2"><span class="termin" id="toc_16">Меласса</span> — кормовая патока, отход свеклосахарного производства. Представляет собой сиропообразную жидкость темно-бурого цвета со специфическим запахом. Используют в качестве компонента корма сельскохозяйственных животных.</p>
