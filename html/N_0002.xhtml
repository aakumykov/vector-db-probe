  <p class="para2"><span class="termin" id="toc_2">Наждак</span> — мелкозернистая горная порода, в которой корунд находится в сросшемся состоянии с другими минералами (магнетитом, сульфидами металлов, хрупкими слюдами). Из него изготавливают простейшие абразивные изделия (шлифовальные круги, наждачные шкурки и др.).</p>
