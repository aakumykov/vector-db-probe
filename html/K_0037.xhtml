  <p class="para2"><span class="termin" id="toc_43">Керамика черно-красная</span> — красная посуда с верхом и внутренней поверхностью черного цвета. В железном веке была распространена на полуострове Индостан. В I тысячелетии появилась в Южной Индии.</p>
