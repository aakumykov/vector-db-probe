  <p class="para2"><span class="termin" id="toc_20">Уксусные угри</span> — мелкие (длиной 1 — 2 мм) организмы — нежелательные спутники уксусного производства. Иногда они появляются в больших количествах и чаще всего при низких концентрациях уксусной кислоты. Уксусные угри безвредны для человека, но, естественно, вызывают негативные эмоции.</p>
