  <p class="para2"><span class="termin" id="toc_61">Сидероз</span> — профессиональное заболевание легких, возникающее при длительном вдыхании производственной пыли, содержащей железо. Заболевание встречается при большом стаже работы у электросварщиков, рабочих литейных цехов, полировщиков металлических изделий и т. п.</p>
