  <p class="para2"><span class="termin" id="toc_22">Эликсир жизни (эликсир молодости)</span>. Алхимики в средние века выдвинули идею о существовании особого вещества, способного при введении в организм вылечивать любые болезни и предотвращать старение. Поиски этого эликсира сыграли ту же роль в развитии химии, как и поиск философского камня.</p>
