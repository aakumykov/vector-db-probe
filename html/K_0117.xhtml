  <p class="para2"><span class="termin" id="toc_144">Купоросное масло</span> — устаревшее название безводной серной кислоты. Она была получена на заре алхимии нагреванием природного железного купороса, который на воздухе подвергается превращениям:</p>

  <p class="para0">FeSO<sub>4</sub> · 7Н<sub>2</sub>О → H<sub>2</sub>SO<sub>4</sub> + FeO + 6Н<sub>2</sub>О</p>

  <p class="para0">4FeO + O<sub>2</sub> → 2Fe<sub>2</sub>O<sub>3</sub></p>
