  <p class="para2"><span class="termin" id="toc_51">Серная печень</span> Na<sub>2</sub>Sn — смесь полисульфидов натрия; получается при растворении мелкорастертой серы в крепком (концентрированном) растворе сульфида натрия:</p>

  <p class="para0">Na<sub>2</sub>S + (n - 1)S = Na<sub>2</sub>S<sub>n</sub></p>

  <p class="para2">Используют серную печень в кожевенной промышленности для снятия волоса со шкур.</p>
