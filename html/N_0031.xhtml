  <p class="para2"><span class="termin" id="toc_39">Нуклеопротеиды</span> — сложные белки, содержащие нуклеиновые кислоты. Нуклеопротеиды находятся в составе клеточных ядер и плазме животных и растений. В хромосомах нуклеопротеиды являются носителями генетической информации. В вирусах нуклеопротеиды являются главной, а часто и единственной их составляющей.</p>
