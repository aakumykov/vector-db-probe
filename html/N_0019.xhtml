  <p class="para2"><span class="termin" id="toc_22">Нигрол</span> (лат. niger — черный + oleum — масло) — отстоявшийся отфильтрованный масляный гудрон. Применяют главным образом для смазки механизмов, работающих при невысоких температурах: зубчатых передач автомобилей, тракторов и др.</p>
