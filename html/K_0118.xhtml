  <p class="para2"><span class="termin" id="toc_145">Купоросы</span> — техническое название минералов, являющихся кристаллогидратами некоторых двухзарядных металлов: железный купорос FeSO<sub>4</sub> · 7Н<sub>2</sub>О (минерал мелантерит), медный CuSO<sub>4</sub> · 5Н<sub>2</sub>О (минерал халькантит), никелевый NiSO<sub>4</sub> · 7Н<sub>2</sub>О (минерал моренозит), цинковый ZnSO<sub>4</sub> · 7Н<sub>2</sub>О (минерал госларит) и др.</p>
