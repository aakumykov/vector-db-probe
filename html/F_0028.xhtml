  <p class="para2"><span class="termin" id="toc_36">Фосфатурия</span> (фосфаты + греч. uron — моча) — повышенное выделение солей фосфорной кислоты с мочой. Проявляется в виде осадка в свежевыпущенной моче. Наблюдается при нарушении обмена фосфора в организме. Может сопровождаться тупыми болями в поясничной области, нарушением мочеиспускания.</p>
