  <p class="para2"><span class="termin" id="toc_78">Антиоксиданты (антиокислители)</span> — вещества, предотвращающие или замедляющие окислительные процессы (чаше всего под действием молекулярного кислорода), которые приводят к старению полимеров, осмолению топлив, прогорканию жиров и т. п.</p>
